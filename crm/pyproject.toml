[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anqiao-crm"
version = "0.1.0"
description = "Server-side CRM for the approved manual core-record slice."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.18.4",
    "argon2-cffi==25.1.0",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "itsdangerous>=2.1.2",
    "jinja2>=3.1.2,<3.1.5",
    "psycopg[binary]==3.3.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.22",
    "sqlalchemy==2.0.51",
    "uvicorn==0.43.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

