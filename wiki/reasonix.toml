      console.log(`  ${f}:${i+1}: ${lines[i].trim()}`);\n    }\n  }\n}\nconsole.log(\"复查完成\");\nENDSCRIPT\nnode fix-tmp.mjs; echo \"exit=$?\"; rm -f fix-tmp.mjs", "Bash=cd /d/Project/中科安樵/wiki && cat > fix-tmp.mjs <<'ENDSCRIPT'\nimport { readFileSync, writeFileSync } from \"node:fs\";\n\nconst files = [\"SPEC.md\", \"PROMPT-deepseek-implement.md\", \"README.md\", \"VERIFY.md\", \"docs/plan.md\"];\n\nconst replacements = [\n  // 粗体声明 + 标点\n  { re: /\\*\\*不使用 Docker\\*\\*：\\s*/g,      to: \"\" },\n  { re: /\\*\\*不适用 Docker\\*\\*\\s*/g,        to: \"\" },\n  { re: /\\*\\*本项目不适用 Docker。\\*\\*\\s*/g, to: \"\" },\n  { re: /\\*\\*本项目不适用 Docker\\*\\*\\s*/g,  to: \"\" },\n  // 括号内声明\n  { re: /（本项目不使用 Docker，直接装预编译包）/g, to: \"（直接装预编译包）\" },\n  // 残留的\"；不使用容器\"等（第二轮）\n  { re: /；不使用容器/g,  to: \"\" },\n  { re: /，不使用容器/g,  to: \"\" },\n  // 清理可能产生的多余空格\n  { re: /：\\s+/g, to: \"：\" },\n  { re: /[ ]{2,}/g, to: \" \" },\n];\n\nfor (const f of files) {\n  let t = readFileSync(f, \"utf8\");\n  const before = t;\n  for (const { re, to } of replacements) {\n    t = t.replace(re, to);\n  }\n  if (t !== before) {\n    writeFileSync(f, t);\n    console.log(f, \"已修改\");\n  } else {\n    console.log(f, \"无变更\");\n  }\n}\n\nconsole.log(\"\\n=== 最终复查 ===\");\nfor (const f of files) {\n  const t = readFileSync(f, \"utf8\");\n  const lines = t.split(\"\\n\");\n  for (let i = 0; i < lines.length; i++) {\n    if (/docker/i.test(lines[i]) && !/Dockerfile/i.test(lines[i]) && !/docker-compose/i.test(lines[i])) {\n      console.log(`  ${f}:${i+1}: ${lines[i].trim()}`);\n    }\n  }\n}\nconsole.log(\"复查完成\");\nENDSCRIPT\nnode fix-tmp.mjs; echo \"exit=$?\"; rm -f fix-tmp.mjs", "Bash=cd /d/Project/中科安樵/wiki && echo \"=== SPEC §2 ===\" && sed -n '48,50p' SPEC.md && echo \"=== PROMPT L91-96 ===\" && sed -n '91,96p' PROMPT-deepseek-implement.md && echo \"=== README 部署标题 ===\" && sed -n '54,70p' README.md && echo \"=== VERIFY §10.11 ===\" && sed -n '235,243p' VERIFY.md", "Bash=cd /d/Project/中科安樵/wiki && echo \"=== PROMPT L89-93 ===\" && sed -n '89,93p' PROMPT-deepseek-implement.md && echo \"=== README 部署到安全设计交界 ===\" && grep -n \"零交叉。\" README.md && echo \"=== VERIFY 说明行 ===\" && grep -n \"非 Docker\\|Dockerfile\\|docker-compose\" VERIFY.md", "Bash=cd /d/Project/中科安樵/wiki && grep -n \"Postgres\\|服务器原生\\|SSH 隧道\\|开发库\\|数据库做开发\\|可用.*PostgreSQL\" PROMPT-deepseek-implement.md; echo \"===\"; sed -n '66,68p' README.md", "Bash=cd /d/Project/中科安樵/wiki && cat > fix-tmp.mjs <<'ENDSCRIPT'\nimport { readFileSync, writeFileSync } from \"node:fs\";\n\nconst edits = [\n  // docs/plan.md\n  { file: \"docs/plan.md\", old: \"原 `Dockerfile`/`docker-compose.yml` 已删除。\", new: \"\" },\n  { file: \"docs/plan.md\", old: \"验证：compose 已删除（无容器）；\", new: \"验证：\" },\n  // README.md\n  { file: \"README.md\", old: \"（standalone，无容器）\", new: \"（standalone）\" },\n  // VERIFY.md\n  { file: \"VERIFY.md\", old: \" # 直接运行（无容器）\", new: \" # 直接运行\" },\n  { file: \"VERIFY.md\", old: \"已按用户要求删除 `Dockerfile` / `docker-compose.yml`（无容器化交付物），全部改为非 Docker 部署（standalone + node 直接运行）。\", new: \"部署方案：standalone + node 直接运行 + nginx 反代。\" },\n  // README.md 段落合并修复\n  { file: \"README.md\", old: \"零交叉）。## 关键安全设计\", new: \"零交叉）。\\n\\n## 关键安全设计\" },\n];\n\nfor (const { file, old, new: repl } of edits) {\n  let t = readFileSync(file, \"utf8\");\n  if (!t.includes(old)) { console.log(\"FAIL:\", file, \"未找到:\", old.slice(0, 40)); continue; }\n  t = t.replace(old, repl);\n  writeFileSync(file, t);\n  console.log(\"OK\", file);\n}\n\nconsole.log(\"\\n=== 最终复查 ===\");\nconst files = [\"SPEC.md\", \"PROMPT-deepseek-implement.md\", \"README.md\", \"VERIFY.md\", \"docs/plan.md\"];\nfor (const f of files) {\n  const t = readFileSync(f, \"utf8\");\n  const lines = t.split(\"\\n\");\n  for (let i = 0; i < lines.length; i++) {\n    const l = lines[i];\n    if (/docker|容器|compose|Dockerfile/i.test(l) && l.trim()) {\n      console.log(`  ${f}:${i+1}: ${l.trim()}`);\n    }\n  }\n}\nconsole.log(\"复查完成\");\nENDSCRIPT\nnode fix-tmp.mjs; echo \"exit=$?\"; rm -f fix-tmp.mjs", "Bash=cd /d/Project/中科安樵/wiki && echo \"=== README 部署 ===\" && sed -n '54,70p' README.md && echo \"=== VERIFY §10.11 ===\" && sed -n '235,243p' VERIFY.md && echo \"=== plan T14 ===\" && sed -n '102,105p' docs/plan.md", "Bash=cd /d/Project/中科安樵/wiki && cat > fix-tmp.mjs <<'ENDSCRIPT'\nimport { readFileSync, writeFileSync } from \"node:fs\";\n\n// ========== SPEC.md ==========\n{\n  let t = readFileSync(\"SPEC.md\", \"utf8\");\n  const edits = [\n    // §1.2 标题\n    [\"### 1.2 v1 不做（推迟二期，明确排除）\", \"### 1.2 v1 范围外（二期）\"],\n    // §1.2 各项：去掉\"不做\"前缀，改为肯定式\n    [\"- AI 工具（锦囊妙计 / AI 话术助手 / 每日简报）——需模型 key + 服务端，且 CRM 侧 AI 外传是单独授权门。**只在导航留一个「敬请期待」占位，不实现 route。**\", \"- AI 工具（锦囊妙计 / AI 话术助手 / 每日简报）为二期；本期仅在导航留「敬请期待」占位，`/api/ai/` 仅 README。\"],\n    [\"- 在线出题 / 在线编课件（CMS）——课件与题库本期为版本化种子数据，改内容改文件。\", \"- 课件与题库为版本化种子数据（`seed/`），改内容直接改文件。CMS 为二期。\"],\n    [\"- 微信登录 / SSO 统一身份 / 手机号登录（本期用 username 登录，见 B6）。\", \"- 本期登录方式：username（微信/SSO/手机号为二期，见 B6）。\"],\n    [\"- CRM 反向写入培训库、培训与 CRM 共享表——**两库零耦合**，只有一个只读 HTTP 接口。\", \"- CRM 与培训库零耦合：仅一个只读 HTTP 接口（§6.3），CRM 不写培训库。\"],\n    [\"- 证书 PDF 生成（见 B1）。\", \"- 证书 PDF 为二期（见 B1），本期仅显示认证状态。\"],\n    [\"- 多语言、C 端购买流程。\", \"- 多语言、C 端购买流程为二期。\"],\n    // §2 数据访问行\n    [\"| 数据访问 | 原生 SQL + `pg`（node-postgres）。**不用 ORM**（不装 Prisma/Drizzle/TypeORM） |\", \"| 数据访问 | 原生 SQL + `pg`（node-postgres） |\"],\n    // §2 会话行\n    [\"| 会话 | **DB 后端会话**：`sessions` 表 + 不可猜的 uuid 存于 httpOnly/Secure/SameSite=Lax cookie；不用 JWT、不用 iron-session |\", \"| 会话 | **DB 后端会话**：`sessions` 表 + uuid cookie（HttpOnly/Secure/SameSite=Lax） |\"],\n    // §2 校验行\n    [\"| 校验 | **手写校验**（必填、长度上限、类型、白名单）。**不装 zod** |\", \"| 校验 | **手写校验**（必填、长度上限、类型、白名单） |\"],\n    // §2.1 依赖锁定\n    [\"- 禁装：任何 ORM、`zod`、任何 UI 组件库（Ant Design/MUI/shadcn）、任何图标库、任何动画库、`next/font/google`（不发外部字体请求，用系统字体栈）。\", \"- 以上清单外的依赖（含 ORM、zod、UI 组件库、图标库、动画库、`next/font/google`）不得引入；字体用系统字体栈。\"],\n    // §2.2 jk\n    [\"- **注意**：旧域名 `jk.aibrain.wiki` 是灾难遗留、曾覆盖业主其它项目，**本项目一律不使用 jk**。\", \"- 域名 `wiki.aibrain.wiki`（旧域名 `jk.aibrain.wiki` 已废弃，勿用）。\"],\n    // §3 标题\n    [\"## §3 角色与权限矩阵（种子事实，勿臆造）\", \"## §3 角色与权限矩阵（种子事实）\"],\n  ];\n  for (const [old, neu] of edits) {\n    if (!t.includes(old)) { console.log(\"SPEC MISS:\", old.slice(0, 50)); continue; }\n    t = t.replace(old, neu);\n  }\n  writeFileSync(\"SPEC.md\", t);\n  console.log(\"SPEC.md done\");\n}\n\n// ========== PROMPT ==========\n{\n  let t = readFileSync(\"PROMPT-deepseek-implement.md\", \"utf8\");\n  const edits = [\n    // 铁律 1 标题\n    [\"### 1. 不编造\", \"### 1. 种子为唯一数据源\"],\n    [\"- 遇到种子里没有的字段（如实名/身份证/手机初始为空），保持空，不要编。\", \"- 种子里没有的字段（如实名/身份证/手机初始为空）保持空。\"],\n    // 铁律 2 标题\n    [\"### 2. 不扩展（只做 SPEC §1.1，严守 §1.2 排除项）\", \"### 2. 严守 v1 范围（SPEC §1.1）\"],\n    [\"- **不做 AI 工具**（锦囊妙计 / 话术助手 / 每日简报）：`/api/ai/*` 只放 README，无 `route.ts`；导航可留\\\"敬请期待\\\"占位。\", \"- AI 工具为二期：`/api/ai/*` 仅 README，无 `route.ts`；导航留\\\"敬请期待\\\"占位。\"],\n    [\"- 不做在线出题 / 在线编课件（CMS）。\", \"- 在线出题/编课件（CMS）为二期。\"],\n    [\"- 不做微信登录 / SSO / 手机号登录（本期 username 登录）。\", \"- 本期登录方式：username（微信/SSO/手机号为二期）。\"],\n    [\"- 不做证书 PDF、多语言、C 端购买。\", \"- 证书 PDF、多语言、C 端购买为二期。\"],\n    [\"- **不让 CRM 反向写库、不与 CRM 共享表**：整合只有一个只读 HTTP 接口（§6.3）。\", \"- CRM 与培训库零耦合：仅一个只读 HTTP 接口（§6.3），CRM 不写培训库。\"],\n    // 铁律 3 标题\n    [\"### 3. 依赖锁定（超出即返工，见 SPEC §2.1）\", \"### 3. 依赖锁定（见 SPEC §2.1）\"],\n    [\"- **不装**：任何 ORM（Prisma/Drizzle/TypeORM）、`zod`（校验全部手写）、任何 UI 组件库 / 图标库 / 动画库、`next/font/google`（用系统字体栈）。\", \"- 以上清单外的依赖（含 ORM、zod、UI 组件库、图标库、动画库、`next/font/google`）不得引入；字体用系统字体栈。\"],\n    [\"- 数据库用原生 SQL + `pg`；迁移用 `.sql` 文件 + `scripts/migrate.mjs` 顺序执行；不用任何迁移框架。\", \"- 数据库：原生 SQL + `pg`；迁移：`.sql` 文件 + `scripts/migrate.mjs` 顺序执行。\"],\n    // 铁律 4 安全铁律中的两个可微调\n    [\"- **全站鉴权**：除 `/login` 外所有页面、课件内容、取题接口、后台、内部接口都要有效会话；未登录一律 302 到 `/login`。用**一个 middleware 统一拦截**，不允许任何路由漏保护。\", \"- **全站鉴权**：除 `/login` 外所有页面、课件内容、取题接口、后台、内部接口都要有效会话；未登录一律 302 到 `/login`。用 proxy 统一拦截，覆盖所有路由。\"],\n    [\"- **不被索引**：全站响应头 `X-Robots-Tag: noindex, nofollow`；`robots.txt` 全站 Disallow。\", \"- **全站 noindex**：响应头 `X-Robots-Tag: noindex, nofollow`；`robots.txt` 全站 Disallow。\"],\n  ];\n  for (const [old, neu] of edits) {\n    if (!t.includes(old)) { console.log(\"PROMPT MISS:\", old.slice(0, 50)); continue; }\n    t = t.replace(old, neu);\n  }\n  writeFileSync(\"PROMPT-deepseek-implement.md\", t);\n  console.log(\"PROMPT done\");\n}\n\nconsole.log(\"完成\");\nENDSCRIPT\nnode fix-tmp.mjs; echo \"exit=$?\"; rm -f fix-tmp.mjs"]

