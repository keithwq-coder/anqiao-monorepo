# 中科安樵经销商赋能培训系统 — nginx 反代配置（wiki.aibrain.wiki → 127.0.0.1:2929）
# 放置：/etc/nginx/conf.d/wiki.aibrain.wiki.conf（与 WEB/CRM 同机，腾讯云轻量服务器）
# 注意：证书路径按服务器实际配置调整；/api/internal/ 仅限本机/内网来源（CRM 同机调用）

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name wiki.aibrain.wiki;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wiki.aibrain.wiki;

    ssl_certificate     /etc/letsencrypt/live/wiki.aibrain.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.aibrain.wiki/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 禁目录列举（全局）
    autoindex off;

    # 常规安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10m;

    # 主站反代
    location / {
        proxy_pass http://127.0.0.1:2929;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 内部只读接口：仅允许本机/内网来源（CRM 同机调用），其余一律拒绝
    location /api/internal/ {
        allow 127.0.0.1;
        allow ::1;
        # 如有内网网段可按需放开，例如：allow 10.0.0.0/8;
        deny all;

        proxy_pass http://127.0.0.1:2929;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
