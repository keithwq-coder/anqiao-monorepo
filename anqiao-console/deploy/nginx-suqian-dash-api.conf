# nginx 片段：/suqian-dash/ 补 API 反代 → console server :2831
# 对应 INTEGRATION-SPEC §2.3 / §8 阶段三：现状 /suqian-dash/ 仅静态 alias，线上靠 mock；
# 本块补 /v1 反代后宿迁大屏走真接口（与 /dash/ 同源同后端）。
# 用法：并入 /etc/nginx/sites-enabled/anqiao 的 server { } 内。
# 变更前备份：cp /etc/nginx/sites-enabled/anqiao /tmp/anqiao.bak-$(date +%Y%m%d%H%M%S)
# ⚠ 夜间窗口执行（23:00-06:00）；nginx -t 失败自动回滚（见 WINDOW-A-runbook.md）。

    # ---- /suqian-dash/v1/ → console server :2831（宿迁大屏业务 API）----
    location /suqian-dash/v1/ {
        proxy_pass http://127.0.0.1:2831/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 握手（/suqian-dash/v1/ws?token=...）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

# 说明：宿迁大屏构建时 VITE_API_BASE=/suqian-dash/v1（见 dashboard 仓 README）。
# 凯健大屏同源走 /v1/（已由 nginx-v1-location.conf 覆盖），VITE_API_BASE 留空。
