# nginx 片段：/v1/ 统一业务 API 反代 → anqiao-console.service:2831
# 对应 INTEGRATION-SPEC §2.3 目标态；阶段一（窗口 A）新增本块，旧 /saas/api/ 指向 2830 不动。
# 用法：并入 /etc/nginx/sites-enabled/anqiao 的 server { } 内（与 /saas/、/dash/ 同级）。
# 变更前务必备份：cp /etc/nginx/sites-enabled/anqiao /tmp/anqiao.bak-$(date +%Y%m%d%H%M%S)
# nginx -t 通过后 reload；失败按 WINDOW-A-runbook.md §回滚 恢复备份。

    # ---- /v1/ 统一业务 API（console server :2831）----
    location /v1/ {
        proxy_pass http://127.0.0.1:2831;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 握手（/v1/ws?token=...）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

# 过渡期兼容（未决项 2：稳定后再收编）——若需将 /saas/api/ 一并切到 2831，另起窗口执行：
#   location /saas/api/ {
#       proxy_pass http://127.0.0.1:2831/;   # 剥 /saas/api 前缀
#       ...（同上 WS 头）...
#   }
# 阶段一保持现状：/saas/api/ 仍指向旧 2830。
