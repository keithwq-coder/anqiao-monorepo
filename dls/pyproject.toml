[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anqiao-dls"
version = "0.1.0"
description = "中科安樵 DLS 渠道合作方系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "argon2-cffi",
    "jinja2",
    "itsdangerous",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["channel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
